# Keeps the SHA-pinned actions and the npm tree current by PR, so pins stay
# a reviewed diff instead of rotting. Actions PRs bump the pinned commit and
# its version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Retained pins; the reasons live in .github/workflows/ci.yml under
    # "Retained pins". Minor and patch updates still arrive by PR.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: node-gyp
        update-types: ["version-update:semver-major"]
