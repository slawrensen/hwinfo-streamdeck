name: docs-gallery-render

on:
  push:
    branches:
      - 'docs/renderer-gallery-preview-*'
    paths:
      - 'scripts/docs-gallery-render.mjs'
      - 'scripts/docs-gallery-raster.mjs'
      - 'scripts/fixtures/docs-gallery/**'
      - 'scripts/lib/docs-gallery-*'
      - 'scripts/lib/ttf.mjs'
      - 'docs/assets/img/showcase/gallery/sources/**'
      - 'src/ui/**'
      - 'com.lawrensen.hwinfo.sdPlugin/themes.json'
      - 'package-lock.json'
      - '.github/workflows/docs-gallery-render.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies without install scripts
        run: npm ci --ignore-scripts
      - name: Generate production-renderer SVG compositions
        run: npx --no-install tsx scripts/docs-gallery-render.mjs --out .gallery-render-work
      - name: Capture with installed Windows Tahoma and verify pixels
        run: npx --no-install tsx scripts/docs-gallery-raster.mjs --input .gallery-render-work --output .gallery-render-work/final
      - name: Retain verified gallery assets and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-gallery-render
          path: .gallery-render-work/final/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
