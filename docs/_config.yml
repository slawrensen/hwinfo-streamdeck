# GitHub Pages / just-the-docs configuration for the documentation site.
# Publish: repo Settings -> Pages -> Deploy from a branch -> main -> /docs.
title: HWiNFO Sensors for Stream Deck
description: >-
  Live HWiNFO sensor readings on your Elgato Stream Deck: temperatures, clocks,
  fan speeds, usage and power, with themes, thresholds and sparklines.

# Served at https://docs.slawrensen.com/hwinfo-streamdeck/ as a project site
# under the slawrensen.github.io user repo (which owns the custom domain).
# This repo carries NO CNAME; it inherits the domain as a subpath.
url: https://docs.slawrensen.com
baseurl: /hwinfo-streamdeck

remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-relative-links

defaults:
  - scope:
      path: "*.md"
    values:
      layout: default

color_scheme: dark
search_enabled: true
heading_anchors: true
search:
  heading_level: 3
  previews: 2
  preview_words_before: 5
  preview_words_after: 12
  rel_url: false
  focus_shortcut_key: k
enable_copy_code_button: true

# The website preview is independent of the released plugin version.
docs_preview: false
docs_legacy: true
plugin_release:
  version: 1.7.1
  package_version: 1.7.1.0
  tag: v1.7.1
  download: https://github.com/slawrensen/hwinfo-streamdeck/releases/download/v1.7.1/com.lawrensen.hwinfo.streamDeckPlugin
  notes: https://github.com/slawrensen/hwinfo-streamdeck/releases/tag/v1.7.1
  marketplace_version: 1.7.1.0
  checked: 2026-10-27

# Internal release runbooks: kept next to the docs, never published.
exclude:
  - release/
  - README.md
  - Gemfile
  - Gemfile.lock

# Repo links in the header + "edit this page" footer.
aux_links:
  GitHub: https://github.com/slawrensen/hwinfo-streamdeck
  Download: https://github.com/slawrensen/hwinfo-streamdeck/releases/latest
aux_links_new_tab: true

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/slawrensen/hwinfo-streamdeck
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree

footer_content: >-
  MIT licensed. No ads, no telemetry. Not affiliated with REALiX/HWiNFO or
  Elgato. &copy; Stephen Lawrensen.
