<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/brand/hwinfo-logo-32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/img/brand/hwinfo-logo-16.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/brand/hwinfo-logo-180.png' | relative_url }}">
<script>document.documentElement.classList.add('docs-js');</script>
{% if site.docs_preview %}<meta name="robots" content="noindex, nofollow, noarchive">{% endif %}
{% if site.docs_build_id %}<meta name="docs-build-id" content="{{ site.docs_build_id }}"><meta name="docs-source-sha" content="{{ site.docs_source_sha }}">{% endif %}
<link rel="stylesheet" href="{{ '/assets/css/docs.css' | relative_url }}">
<script src="{{ '/assets/js/docs.js' | relative_url }}" defer></script>
